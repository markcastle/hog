name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build hog.exe (MinGW cross-compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64

      - name: Work out version string
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build x64 and x86
        run: |
          mkdir -p dist
          V='-DHOG_VERSION="${{ steps.ver.outputs.version }}"'
          x86_64-w64-mingw32-gcc -O2 -s -Wall "$V" -o dist/hog.exe     src/hog.c
          i686-w64-mingw32-gcc   -O2 -s -Wall "$V" -o dist/hog-x86.exe src/hog.c
          cd dist && sha256sum *.exe > SHA256SUMS.txt
          ls -la

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hog-windows
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hog-windows
          path: dist

      - name: Create release and attach binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/hog.exe
            dist/hog-x86.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
